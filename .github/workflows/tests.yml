name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install --yes graphviz

      - name: Build and run unit tests
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Run end-to-end tests
        run: python3 tests/e2e/run_e2e.py

      - name: Render visualization smoke test
        run: |
          java -jar target/awtr.jar visualize tests/e2e/models/tiny.statespace \
            --output target/tiny.dot
          dot -Tsvg target/tiny.dot -o target/tiny.svg
          test -s target/tiny.svg
